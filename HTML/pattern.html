<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Validation</title>
</head>
<body>
    <h2>User Form</h2>
    <hr>
    <br>
    <form>
        <label for="un">Name: </label>
        <input type="text" id="un" name="username" pattern="^[A-Z]{1}[a-z]{1,50}$" title="Enter only Alphabets"
        placeholder="Abc"> 
        <br>
        <br>
        <label for="Phonenumber">Phone: </label>
        <input type="tel" id="Phonenumber" name="Phone" pattern="^\+91\s[6-9]\d{4}-\d{3}-\d{4}$"
        title="Enter Only Numbers" placeholder="91990-166-7891">
        <br>
        <br>
        <label for="pwd">Password:</label>
        <input type="text" id="pwd" name="Password" pattern="^[A-Za-z\d@$!%*?&#]{8,}$">
        <br>
        <br>
        <label type="pwd">Email: </label>
        <input type="email" id="pwd" name="email" pattern="^[A-Za-z0-9._-]+@[A-Za-z0-7]+\.[A-Za-z]{2, }$">
        <br>
        <br>
        <button type="submit">Submit</button> &nbsp; &nbsp; &nbsp;
        <button type="reset">Cancel</button>
    </form>
</body>
</html>
